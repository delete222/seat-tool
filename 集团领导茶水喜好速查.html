const GROUPS = ["吉利汽车集团", "吉利控股集团", "吉利汽车销售公司"];
const HOT = /忌口|不耐受|不喝|不吃|不辣|热水|拿铁|话筒|一米栏|自带/;
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let curG = "all";

function hl(text, kw) {
  if (!kw) return esc(text);
  const i = text.toLowerCase().indexOf(kw.toLowerCase());
  if (i < 0) return esc(text);
  return esc(text.slice(0, i)) + "<mark>" + esc(text.slice(i, i + kw.length)) + "</mark>" + esc(text.slice(i + kw.length));
}

function titleHtml(segs, kw) {
  if (!segs) return "";
  return segs.map(([t, gray]) => `<span class="${gray ? "tg" : ""}">${hl(t, kw)}</span>`).join("");
}

const fullTitle = p => p.title ? p.title.map(s => s[0]).join("") : "";

function match(p, kw) {
  if (curG !== "all" && p.g !== curG) return false;
  if (!kw) return true;
  return [p.name, p.alias, fullTitle(p), p.tea, p.extra].filter(Boolean).join(" ").toLowerCase().includes(kw.toLowerCase());
}

function render() {
  const kw = $("#search").value.trim();
  const list = $("#list");
  list.innerHTML = "";
  let shown = 0;

  GROUPS.forEach(g => {
    const items = DATA.filter(p => p.g === g && match(p, kw));
    const real = items.filter(p => p.idx).length;
    if (!items.length) return;
    shown += real;
    const sec = document.createElement("section");
    sec.innerHTML = `<div class="gtitle">${g}<span class="gcount">${real} 位</span></div><div class="grid"></div>`;
    const grid = sec.querySelector(".grid");
    items.forEach(p => {
      const c = document.createElement("div");
      c.className = "card";
      let inner = `<div class="row1">`;
      if (p.idx) inner += `<span class="idx">${p.idx}</span>`;
      inner += `<span class="name">${hl(p.name, kw)}${p.alias ? ` <span class="alias">（${hl(p.alias, kw)}）</span>` : ""}</span>`;
      if (p.idx) {
        const none = p.tea === "—";
        const hot = !none && HOT.test(p.tea + (p.extra || ""));
        inner += `<span class="tea ${none ? "none" : hot ? "hot" : ""}">${none ? "未备注" : hl(p.tea, kw)}</span>`;
      }
      inner += `</div>`;
      if (p.title) inner += `<div class="title">${titleHtml(p.title, kw)}</div>`;
      if (p.extra) inner += `<div class="warn">⚠ ${hl(p.extra, kw)}</div>`;
      c.innerHTML = inner;
      grid.appendChild(c);
    });
    list.appendChild(sec);
  });

  $("#stat").textContent = kw ? `搜索"${kw}"：命中 ${shown} 位` : `共 ${shown} 位领导`;
  $("#empty").style.display = shown ? "none" : "block";
}

$("#search").addEventListener("input", render);
$("#tabs").addEventListener("click", e => {
  const t = e.target.closest(".tab");
  if (!t) return;
  curG = t.dataset.g;
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x === t));
  render();
});
render();
</script>
</body>
</html>
